services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doctor
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: doctor_dev_only
    ports: ["5432:5432"]
    volumes: [doctor_pg:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
volumes:
  doctor_pg: